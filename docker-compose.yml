
services:
  bot_service:
    build:
      context: .
      network: host
    dns:
      - 127.0.0.1
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/alerts.db
    volumes:
      - alerts_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  alerts_data:
